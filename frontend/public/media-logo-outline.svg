<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" role="img" aria-label="Media play logo">
  <defs>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D8F5"/>
      <stop offset="48%" stop-color="#587BFF"/>
      <stop offset="100%" stop-color="#8D24F5"/>
    </linearGradient>
    <linearGradient id="play" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F6F7FF"/>
      <stop offset="100%" stop-color="#DDE5FF"/>
    </linearGradient>
  </defs>

  <!-- transparent background -->

  <!-- speed bars with black contour -->
  <rect x="55" y="73" width="185" height="36" rx="18"
        fill="url(#bars)" stroke="#050608" stroke-width="10"/>
  <rect x="112" y="143" width="128" height="36" rx="18"
        fill="url(#bars)" stroke="#050608" stroke-width="10"/>
  <rect x="169" y="213" width="71" height="36" rx="18"
        fill="url(#bars)" stroke="#050608" stroke-width="10"/>

  <!-- play symbol with black contour -->
  <path d="M277 38
           C267 31 253 38 253 51
           V269
           C253 282 267 289 277 282
           L446 174
           C457 167 457 153 446 146
           Z"
        fill="url(#play)"
        stroke="#050608"
        stroke-width="11"
        stroke-linejoin="round"/>
</svg>
