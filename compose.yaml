services:
  backend:
    build:
      context: ./backend

    container_name: media-downloader-backend

    ports:
      - "4000:4000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    working_dir: /app

    command: npm run dev

    environment:
      PORT: 4000

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

    container_name: media-downloader-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend